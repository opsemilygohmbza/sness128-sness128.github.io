<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Snowgrave Berdly Simulator</title>
    <link rel="icon" type="image/x-icon" href="images/snowgrave/Berdley_snowgrave.png">
</head>
<main>
    <audio id="gaster" src="audio/gaster.mp3" preload="auto"></audio>
    <body>
        <div class="main">
            <div class="logo">
                <h1>Snowgrave Berdly Simulator</h1> 
            </div>
            <div>
                <p id="p1" class="friendsub">I don't know why I made this.</p>
                <p id="p2" class="friendsub">It looks really bad but I will not be improving it.</p>
                <p id="p3" class="friendsub" style="display: none">Congratulations on Snowgraving Berdly 10 times. Find the secret Noelle to access a hidden page.</p>
            </div>
            <div style="margin-left: 25%; margin-top: 20%; margin-top: 30%;">
                <img id="noelle" src="images/snowgrave/Noelle_idle.gif" style="margin-left:5%; margin-right: 15%;"/>
                <img id="berdley" src="images/snowgrave/Berdley_idle.gif" style="margin-right:5%; margin-left: 15%"/>
            </div>
            <div class="flex-container">
                <button class="snowbut" onclick="activateSnowgrave()" style="margin-right: 10%">SNOWGRAVE</button>
                <button class="snowbut" onclick="reset()">RESET</button>
            </div>
            <div style="margin-top: 300%; margin-bottom: 50%">
                <a href="proceed.html" target="_blank" onclick="playJingle();">
                    <img id="noelle2" style="display: none; max-width: 10px; margin-left: 80%" src="images/snowgrave/Noelle_lake.gif">
                </a>
                
            </div>
            <script>
                let snowgraved = false;
                let snowgraving = false;
                let snowCount = 0;
                const sound = new Audio('audio/snowgrave.mp3');
                const jingle = new Audio('audio/jingle.wav');
                async function activateSnowgrave() {
                    if (!snowgraved) {
                        snowgraved = true;
                        snowgraving = true;
                        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms)); 
                        
                        sound.play();
                        document.getElementById("noelle").src = "images/snowgrave/Noelle_snowgrave.gif";
                        await sleep(1000);
                        document.getElementById("berdley").src = "images/snowgrave/Berdley_hurt.png";
                        await sleep(3000);
                        document.getElementById("berdley").src = "images/snowgrave/Berdley_snowgrave.png";
                        document.getElementById("berdley").style.maxWidth = "74px";
                        await sleep(300);
                        document.getElementById("noelle").src = "images/snowgrave/Noelle_victory.gif";
                        snowCount++;
                        snowgraving = false;
                        if (snowCount == 10) {
                            document.getElementById("p1").style.display = "none";
                            document.getElementById("p2").style.display = "none";
                            document.getElementById("p3").style.display = "";
                            document.getElementById("noelle2").style.display = "";
                        }
                    }
                }
                function reset() {
                    if(!snowgraving) {
                        document.getElementById("noelle").src = "images/snowgrave/Noelle_idle.gif";
                        document.getElementById("berdley").src = "images/snowgrave/Berdley_idle.gif";
                        document.getElementById("berdley").style.maxWidth = "";
                        snowgraved = false;
                    }
                    
                }
                function playJingle() {

                    jingle.play();
                }
            </script>
        
        </div>

    </body>

</main>
