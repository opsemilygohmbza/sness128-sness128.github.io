<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>PROCEED</title>
    <link rel="icon" type="image/x-icon" href="images/SOUL_battle.png">
</head>
<main>
    <audio id="gaster" src="audio/gaster.mp3" preload="auto"></audio>
    <body>
        <div class="main">
            <div class="friendlogo">
                <h1 style="color: red">PROCEED</h1> 
            </div>
            <div class="normal">
                <p class="normal">You know what to do.</p>
            </div>
            <br>
            <br>
            <br>
            <br>
            <div class="flex-container">
                <button id= "proc" class="snowbut" onclick="PlayProceed()">PROCEED</button>
                <a id="kris" style="display: none;" href ="knight.html"><img src="images/snowgrave/Kris_lake.png"/></a>
                
            </div>
            
        <script>
            let proceedCount = 0;
            let jingle = new Audio('audio/jingle.wav');
            let jingle_hell = new Audio('audio/jingle_hell.wav');
            let jingle_hell_super = new Audio('audio/jingle_hell_super.wav');
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms)); 
            async function PlayProceed() {
                if (proceedCount >= 73) {
                    document.getElementById("proc").style.display = "none";
                    await sleep(10000);
                    document.getElementById("kris").style.display = "";
                } else if(proceedCount > 13) {
                    //jingle_hell_super.play();
                    jingle_hell_super.cloneNode(true).play();
                } else if (proceedCount > 6) {
                    //jingle_hell.play();
                    jingle_hell.cloneNode(true).play();
                } else {
                    //jingle.play();
                    jingle.cloneNode(true).play();
                }
                proceedCount++;
            }
        </script>
        </div>

    </body>

</main>
